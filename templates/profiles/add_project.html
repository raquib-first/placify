{% extends "base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'profiles/add_project.css' %}">

<div class="form-wrapper">

    <div class="form-card">
        <h2>  Add New Project</h2>
        <p class="subtitle">Showcase your work to the world</p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Project Title</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label>Description</label>
                {{ form.description }}
            </div>

            <div class="form-group">
                <label>Tech Stack</label>
                {{ form.tech_stack }}
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>GitHub Link</label>
                    {{ form.github_link }}
                </div>

                <div class="form-group">
                    <label>Live Link</label>
                    {{ form.live_link }}
                </div>
            </div>

            <button type="submit" class="btn submit">
                  Save Project
            </button>
        </form>
    </div>

</div>

{% endblock %}
