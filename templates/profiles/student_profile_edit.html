{% extends 'base.html' %}
{% load static %}

{% block content %}
<title>Edit Profile</title>

<link rel="stylesheet" href="{% static 'profiles/student_profile_edit.css' %}">

<div class="page-wrapper">

    <!-- Header -->
    <header class="page-header">
        <h1>Edit Your Profile</h1>
        <p>Keep your information updated to get better opportunities</p>
    </header>

    <!-- Form Card -->
    <div class="form-card">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-grid">
                {{ form.as_p }}
            </div>

            <!-- Actions -->
            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    Save Changes
                </button>
                <a href="javascript:history.back()" class="btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>
{% endblock %}
