{% extends "base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'profiles/edit_project.css' %}">

<div class="form-wrapper">

    <div class="form-card">
        <h2>✏ Edit Project</h2>
        <p class="subtitle">Update your project details</p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Project Title</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label>Description</label>
                {{ form.description }}
            </div>

            <div class="form-group">
                <label>Tech Stack</label>
                {{ form.tech_stack }}
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>GitHub Link</label>
                    {{ form.github_link }}
                </div>

                <div class="form-group">
                    <label>Live Link</label>
                    {{ form.live_link }}
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn save">
                    💾 Update Project
                </button>

                <a href="{% url 'profiles:projects' %}" class="btn cancel">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</div>

{% endblock %}
