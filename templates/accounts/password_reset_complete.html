{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'accounts/password_reset_complete.css' %}">
    <title>Password Reset Complete</title>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card success-card">
            <div class="success-icon-container">
                <svg xmlns="http://www.w3.org/2000/svg" class="success-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            </div>

            <div class="auth-header">
                <h2>Password Updated!</h2>
                <p>Your password has been changed successfully. You can now use your new password to sign in to your account.</p>
            </div>

            <div class="action-area">
                <a href="{% url 'accounts:login' %}" class="btn-submit">
                    Go to Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
