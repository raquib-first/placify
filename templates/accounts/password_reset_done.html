{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'accounts/password_reset_done.css' %}">
    <title>Document</title>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card success-state">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke-linecap="round" stroke-linejoin="round"></path>
                    <polyline points="22 4 12 14.01 9 11.01" stroke-linecap="round" stroke-linejoin="round"></polyline>
                </svg>
            </div>
    
            <div class="auth-header">
                <h2>Check your email</h2>
                <p>We've sent a password reset link to your inbox. Please check your spam folder if you don't see it within a few minutes.</p>
            </div>
    
            <div class="action-area">
                <a href="{% url 'accounts:login' %}" class="btn-submit">Return to Login</a>
                
                <p class="resend-text">
                    Didn't receive the email? 
                    <a href="{% url 'password_reset' %}" class="resend-link">Try again</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
