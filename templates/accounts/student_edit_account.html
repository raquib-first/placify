{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Account</title>
    <link rel="stylesheet" href="{% static 'accounts/student_edit_account.css' %}">
</head>
<body>

<div class="page-wrapper">

    <div class="account-card">
        <h2>Edit Account</h2>

        <form method="post">
            {% csrf_token %}

            <div class="form-row">
                <label>Username</label>
                {{ form.username }}
                {% if form.username.errors %}
                    <small class="error">{{ form.username.errors.0 }}</small>
                {% endif %}
            </div>

            <div class="form-row">
                <label>Email</label>
                {{ form.email }}
                {% if form.email.errors %}
                    <small class="error">{{ form.email.errors.0 }}</small>
                {% endif %}
            </div>

            <div class="form-row">
                <label>First Name</label>
                {{ form.first_name }}
            </div>

            <div class="form-row">
                <label>Last Name</label>
                {{ form.last_name }}
            </div>

            <div class="button-group">
                <button type="submit" class="btn-save">
                    Save Changes
                </button>

                <a href="{% url 'dashboard:student_dashboard' %}" class="btn-cancel">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</div>

</body>
</html>
