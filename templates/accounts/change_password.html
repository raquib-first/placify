{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <link rel="stylesheet" href="{% static 'accounts/change_password.css' %}">
</head>
<body>

<div class="auth-container">
    <h2>Change Password</h2>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="error">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
        {% endfor %}

        {% if form.non_field_errors %}
            <div class="error">
                {{ form.non_field_errors.0 }}
            </div>
        {% endif %}

        <button type="submit" class="btn-primary">
            Update Password
        </button>
    </form>

</div>

</body>
</html>
